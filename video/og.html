<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShipSafe social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(circle at 85% 15%,rgba(64,140,200,.28),transparent 45%),radial-gradient(circle at 5% 100%,rgba(102,180,76,.18),transparent 45%),#0E2350;color:#F3F6FB;font-family:'DM Sans',sans-serif;position:relative}
.logo{position:absolute;left:72px;top:60px;height:56px}
.badge{position:absolute;left:72px;top:170px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;letter-spacing:2px;color:#7CC463;border:2px solid rgba(102,180,76,.5);background:rgba(102,180,76,.12);border-radius:100px;padding:10px 22px}
h1{position:absolute;left:72px;top:240px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-3px}
h1 span{color:#66B44C}
.slogan{position:absolute;left:72px;top:455px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:34px;color:#408CC8}
.slogan b{color:#F3F6FB;font-weight:700}
.sub{position:absolute;left:72px;top:515px;font-size:24px;color:rgba(243,246,251,.75)}
.card{position:absolute;right:64px;top:170px;width:330px;background:#15387A;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px 22px 14px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.card .r{font-family:'IBM Plex Mono',monospace;font-size:14px;color:rgba(243,246,251,.75);margin-bottom:12px}
.bar{height:6px;border-radius:3px;background:#66B44C;margin-bottom:14px}
.it{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
.ck{width:20px;height:20px;border-radius:5px;background:#66B44C;color:#0E2350;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>
  <img class="logo" src="../public/logo-dark.png" alt="">
  <div class="badge">GLOBAL TRADE COMPLIANCE · ANY PRODUCT</div>
  <h1>Compliant.<br><span>Every shipment.</span></h1>
  <div class="slogan">Know it. <b>Check it.</b> Ship it.</div>
  <div class="sub">Know what customs requires — before your container leaves port.</div>
  <div class="card">
    <div class="r">🇮🇩 → 🇩🇪 · FOB · Furniture</div>
    <div class="bar"></div>
    <div class="it"><span class="ck">✓</span>EUDR due diligence</div>
    <div class="it"><span class="ck">✓</span>FLEGT legality licence</div>
    <div class="it"><span class="ck">✓</span>ISPM 15 pallets</div>
    <div class="it"><span class="ck">✓</span>Docs match the LC</div>
  </div>
</body>
</html>
