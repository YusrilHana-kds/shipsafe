<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShipSafe social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(circle at 85% 30%,rgba(64,140,200,.30),transparent 45%),radial-gradient(circle at 70% 90%,rgba(120,190,240,.28),transparent 45%),#F2F8FE;color:#0B1F44;font-family:'DM Sans',sans-serif;position:relative}
.logo{position:absolute;left:72px;top:60px;height:56px}
.badge{position:absolute;left:72px;top:170px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:21px;letter-spacing:0;color:#1F6FB8;border:2px solid #D6E4F3;background:#FFFFFF;border-radius:100px;padding:10px 22px}
h1{position:absolute;left:72px;top:240px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-3px}
h1 span{color:#1F6FB8}
.slogan{position:absolute;left:72px;top:455px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:34px;color:#408CC8}
.slogan b{color:#0B1F44;font-weight:700}
.sub{position:absolute;left:72px;top:515px;font-size:24px;color:#55657F}
.card{position:absolute;right:64px;top:170px;width:330px;background:#FFFFFF;border:1px solid #D6E4F3;border-radius:16px;padding:22px 22px 14px;box-shadow:0 24px 60px -20px rgba(21,56,122,.3)}
.card .r{font-family:'IBM Plex Mono',monospace;font-size:14px;color:#55657F;margin-bottom:12px}
.bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#408CC8,#2F9E44);margin-bottom:14px}
.it{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;padding:9px 0;border-top:1px solid #E6EEF7}
.ck{width:20px;height:20px;border-radius:5px;background:#2F9E44;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>
  <img class="logo" src="../public/logo-light.png" alt="">
  <div class="badge">AI-Powered · Your Copilot for Global Trade</div>
  <h1>Compliant.<br><span>Every shipment.</span></h1>
  <div class="slogan">Know it. <b>Check it.</b> Ship it.</div>
  <div class="sub">Know what customs requires — before your container leaves port.</div>
  <div class="card">
    <div class="r">🇮🇩 → 🇩🇪 · FOB · Furniture</div>
    <div class="bar"></div>
    <div class="it"><span class="ck">✓</span>EUDR due diligence</div>
    <div class="it"><span class="ck">✓</span>FLEGT legality licence</div>
    <div class="it"><span class="ck">✓</span>ISPM 15 pallets</div>
    <div class="it"><span class="ck">✓</span>Docs match the LC</div>
  </div>
</body>
</html>
